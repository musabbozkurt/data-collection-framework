services:
  db:
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-root_db}
      MARIADB_USER: ${DB_USER:-user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-user}
    volumes:
      - ./db_scripts:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2.3
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8080:80"

  python-api:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: unless-stopped
    depends_on:
      - mongo_db
    environment:
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD:-password}@mongo_db:27017/?authSource=admin
      PY_SERVER_TOKEN: ${PY_SERVER_TOKEN:-}
      X_PROXY: ${X_PROXY:-}
      TWITTER_CONSUMER_KEY: ${TWITTER_CONSUMER_KEY:-}
      TWITTER_CONSUMER_SECRET: ${TWITTER_CONSUMER_SECRET:-}
      TWITTER_ACCESS_KEY: ${TWITTER_ACCESS_KEY:-}
      TWITTER_ACCESS_SECRET: ${TWITTER_ACCESS_SECRET:-}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
    volumes:
      # collected files, the saved X session / exports and config.ini live on the host
      - ./data_collection_framework/data_folders:/app/data_collection_framework/data_folders
      - ./data_collection_framework/x_profile_data:/app/data_collection_framework/x_profile_data
      - ./data_collection_framework/config:/app/data_collection_framework/config
    ports:
      - "127.0.0.1:8000:8000"

  php-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html:ro
    depends_on:
      db:
        condition: service_healthy
      python-api:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-root_db}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-user}
      # rest (default), graphql or tcp. tcp expects `make server` on the host (PY_SERVER_HOST/PORT)
      API_TRANSPORT: ${API_TRANSPORT:-rest}
      PY_API_URL: http://python-api:8000
      PY_SERVER_HOST: host.docker.internal
      PY_SERVER_PORT: ${PY_SERVER_PORT:-5555}
      PY_SERVER_TOKEN: ${PY_SERVER_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:8080"

  mongo_db:
    image: mongo:9.0.4
    container_name: mongo_db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./database/db:/data/db

  mongo-express:
    image: mongo-express
    container_name: mongo_express
    depends_on:
      - mongo_db
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      ME_CONFIG_MONGODB_URL: mongodb://root:${MONGO_ROOT_PASSWORD:-password}@mongo_db:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: mexpress
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-mexpress}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  db_data:
