name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.15.2" ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: data_collection_framework/requirements*.txt
      - run: python -m pip install -r data_collection_framework/requirements-dev.txt
      - run: python -m pytest -v

  php:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5.12"
      - name: Syntax check every PHP file
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

  integration:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [ python, php ]
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack (PHP app, Python API, MariaDB, MongoDB)
        # The runner user owns the checkout; run the API as that user so it can write the mounted folders
        run: |
          mkdir -p data_collection_framework/x_profile_data
          APP_UID=$(id -u) APP_GID=$(id -g) docker compose up -d --build --wait php-app
      - name: Smoke test
        run: bash scripts/smoke_test.sh http://localhost:3000
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs --no-color php-app python-api db
