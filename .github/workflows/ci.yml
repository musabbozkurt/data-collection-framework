name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.12" ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: data_collection_framework/requirements*.txt
      - run: python -m pip install -r data_collection_framework/requirements-dev.txt
      - run: python -m pytest -v

  php:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Syntax check every PHP file
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

  integration:
    name: PHP app + Python server smoke test
    runs-on: ubuntu-latest
    needs: [ python, php ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_collection_framework/requirements*.txt
      - run: python -m pip install -r data_collection_framework/requirements.txt
      - name: Start the Python command server
        # On Linux runners the container reaches the host through the Docker bridge, not loopback
        env:
          PY_SERVER_HOST: 0.0.0.0
        run: |
          nohup python data_collection_framework/server.py > server.log 2>&1 &
          for i in $(seq 1 20); do nc -z 127.0.0.1 5555 && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Start the PHP app and MariaDB
        run: docker compose up -d --build --wait php-app
      - name: Smoke test
        run: bash scripts/smoke_test.sh http://localhost:3000
      - name: Show logs on failure
        if: failure()
        run: |
          cat server.log
          docker compose logs --no-color php-app db
